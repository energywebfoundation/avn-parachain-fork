[package]
name = "avn-service"
license = "GPL-3.0"

version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
# third-party dependencies
codec = { package = "parity-scale-codec", version = "3.6.1" }
structopt = "0.3.8"
log = "0.4.20"
serde_json = "1.0.85"
serde = "1.0.163"
tide = { version = "0.16.0" }
web3 = { version = "0.18.0", default-features = false, features = [
    "http-tls",
    "signing",
] } # implies tls feature
jsonrpsee = { version = "0.16.2", features = ["server"] }
futures = "0.3.21"
anyhow = "1.0.64"
jsonrpc-core = "18.0.0"

# This version must be compatible with web3
tokio = { version = "1.19", features = ["sync"] }

hex = "0.4"
hex-literal = "0.4.1"
# Ensure compatibility by matching sp-core's secp256k1 version. Let cargo handle exact version matching.
secp256k1 = { version = ">0.26.0", features = [
    "recovery",
    "alloc",
] }
web3Secp256k1 = { package = "secp256k1", version = "0.21.2", features = [
    "recovery",
    "alloc",
] }
# This needs to be the same version as the one used in web3, parity-scale-codec and ethereum-transactions pallet
ethereum-types = "0.11.0"

pallet-eth-bridge = { path = "../../pallets/eth-bridge"}
pallet-eth-bridge-runtime-api = { path = "../../pallets/eth-bridge/runtime-api"}
sp-block-builder = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sp-blockchain = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }

# primitives
sp-core = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sp-runtime = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sp-avn-common = { path = "../../primitives/avn-common"}
sp-keystore = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sp-api = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sp-state-machine = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }

# client dependencies
sc-keystore = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sc-service = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sc-client-api = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sc-client-db = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sc-transaction-pool = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
sc-transaction-pool-api = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }

frame-system = { git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }
node-primitives = { version = "2.0.0", git = "ssh://git@github.com/energywebfoundation/polkadot-sdk", rev = "6393ea57e0656edac685c6284735d79044664fe5" }

